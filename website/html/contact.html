<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Roboto&display=swap"
    rel="stylesheet">
</head>

<body id="contact-page">
  <header class="MenuBar">
    <div class="logo"></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="vault.html">Password Vault</a></li>
      <li><a href="strength.html">Strength Checker</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="hamburger">
      <i class="fas fa-bars"></i>
    </div>
  </header>

  <div class="sidebar">
    <div class="close-btn">
      <i class="fas fa-times"></i>
    </div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="vault.html">Password Vault</a></li>
      <li><a href="strength.html">Strength Checker</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </div>

  <!-- Contact Form Section -->
  <section class="contact-form-section">
    <h2>Contact Us</h2>
    <p>Please fill in the form below to reach out to us.</p>
    <form id="contactForm">
      <label for="firstName">First Name:</label>
      <input type="text" id="firstName" name="firstName" required>
      <label for="lastName">Last Name:</label>
      <input type="text" id="lastName" name="lastName" required>
      <label for="gender">Gender:</label>
      <select id="gender" name="gender" required>
        <option value="" disabled selected>Select your gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      <label for="mobile">Mobile:</label>
      <input type="tel" id="mobile" name="mobile" required pattern="[0-9]{10}" placeholder="0512345678">
      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required>
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required>
      <label for="language">Language of Communication:</label>
      <select id="language" name="language" required>
        <option value="" disabled selected>Select your language</option>
        <option value="english">English</option>
        <option value="arabic">Arabic</option>
        <option value="french">French</option>
      </select>
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required placeholder="Your message here..."></textarea>
      <button type="submit">Submit</button>
    </form>
    <div id="error-container"></div>
  </section>

  <script src="../js/hamburger.js"></script>
  <script src="../js/contact.js"></script>
</body>

</html>
